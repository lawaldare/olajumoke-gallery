<div class="grid-wrapper">
  <app-thiings-grid [gridSize]="gridSize" [itemTemplate]="cellTemplate"> </app-thiings-grid>
</div>

<ng-template #cellTemplate let-item>
  @let olajumokeItem = olajumokePictures[item.gridIndex % olajumokePictures.length];
  <div class="cell" (click)="onCellClick(item, olajumokeItem)">
    <img [src]="'assets/olajumoke/' + olajumokeItem" alt="" />
  </div>
</ng-template>
